# XcodeGen fallback for RadioSync.xcodeproj. Only needed if the committed
# project file doesn't open: `brew install xcodegen && xcodegen generate`.
name: RadioSync
options:
  bundleIdPrefix: com.beloose
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RadioSync:
    type: application
    platform: iOS
    sources:
      - path: RadioSync
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloose.RadioSync
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RadioSync/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
  RadioSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RadioSyncTests
    dependencies:
      - target: RadioSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloose.RadioSyncTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  RadioSync:
    build:
      targets:
        RadioSync: all
        RadioSyncTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RadioSyncTests
    profile:
      config: Release
    archive:
      config: Release
